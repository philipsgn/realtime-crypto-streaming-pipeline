version: 2

sources:
  - name: crypto_pipeline
    database: "{{ env_var('POSTGRES_DB', 'crypto_pipeline') }}"
    schema: public
    description: "TimescaleDB tables written by PySpark Structured Streaming"
    freshness:
      warn_after: {count: 10, period: minute}
      error_after: {count: 30, period: minute}
    loaded_at_field: window_start
    tables:
      - name: trade_metrics_1min
        description: "1-minute VWAP/volume aggregations from Spark"
      - name: trade_metrics_5min
        description: "5-minute VWAP/volume aggregations from Spark"

models:
  - name: silver_trades
    description: >
      Cleaned and validated 1-minute trade metrics. Removes windows
      with zero/null price, volume, or trade_count. Flags outliers
      where price moves >50% in a single minute (data error, not volatility).
    tests:
      - unique_combination_of_columns:
          combination_of_columns:
            - window_start
            - symbol
    columns:
      - name: window_start
        description: "Start of the 1-minute aggregation window (UTC)"
        tests:
          - not_null
      - name: symbol
        description: "Binance trading pair symbol"
        tests:
          - not_null
          - accepted_values:
              values:
                - BTCUSDT
                - ETHUSDT
                - SOLUSDT
                - BNBUSDT
                - XRPUSDT
                - ADAUSDT
                - DOGEUSDT
                - AVAXUSDT
      - name: vwap
        description: "Volume-Weighted Average Price for this window"
        tests:
          - not_null
          - expression_is_true:
              expression: ">= 0"
      - name: total_volume
        description: "Sum of trade quantities (token units, not USD)"
        tests:
          - not_null
          - expression_is_true:
              expression: "> 0"
      - name: trade_count
        description: "Number of individual trades in this window"
        tests:
          - not_null
          - expression_is_true:
              expression: "> 0"
      - name: buy_volume
        description: "Buyer-initiated volume (is_buyer_maker = false)"
        tests:
          - not_null
          - expression_is_true:
              expression: "<= total_volume"
      - name: price_open
        description: "First price in window (by event timestamp)"
        tests:
          - not_null
          - expression_is_true:
              expression: "> 0"
      - name: price_close
        description: "Last price in window (by event timestamp)"
        tests:
          - not_null
          - expression_is_true:
              expression: "> 0"

  - name: gold_hourly_vwap
    description: >
      Hourly volume-weighted average price per symbol.
      Aggregated from silver_trades using weighted average, not simple average.
    columns:
      - name: symbol
        tests:
          - not_null
      - name: hourly_vwap
        tests:
          - not_null

  - name: gold_daily_summary
    description: >
      Daily price and volume summary per symbol. price_change_pct is
      calculated as (last_close - first_open) / first_open * 100.
    columns:
      - name: symbol
        tests:
          - not_null
      - name: daily_vwap
        tests:
          - not_null

  - name: gold_minute_volume
    description: >
      Real-time Gold view: per-minute USDT notional volume (vwap * total_volume).
      Comparable across symbols because unit is USD, not token quantity.
    columns:
      - name: window_start
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null
          - accepted_values:
              values:
                - BTCUSDT
                - ETHUSDT
                - SOLUSDT
                - BNBUSDT
                - XRPUSDT
                - ADAUSDT
                - DOGEUSDT
                - AVAXUSDT
      - name: quote_volume_usdt
        description: "Notional USD trading volume = vwap * total_volume"
        tests:
          - not_null
          - expression_is_true:
              expression: "> 0"
      - name: buy_quote_volume_usdt
        description: "Buyer-initiated USD notional = vwap * buy_volume"
        tests:
          - expression_is_true:
              expression: "<= quote_volume_usdt"
      - name: buy_volume
        tests:
          - not_null
