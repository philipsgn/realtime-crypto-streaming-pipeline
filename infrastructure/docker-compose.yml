services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    deploy:
      resources:
        limits:
          memory: 400m
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9093", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC: crypto-trades
      KAFKA_TOPIC_PARTITIONS: "4"
    command:
      - bash
      - -c
      - |
        set -e
        topic="$${KAFKA_TOPIC}"
        desired="$${KAFKA_TOPIC_PARTITIONS}"
        current=$$(/opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9093 \
          --describe \
          --topic "$${topic}" 2>/dev/null \
          | awk -F 'PartitionCount: ' 'NR == 1 {split($$2, a, "\t"); print a[1]}')
        if [ -z "$${current}" ]; then
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9093 \
            --create \
            --topic "$${topic}" \
            --partitions "$${desired}" \
            --replication-factor 1
        elif [ "$${current}" -lt "$${desired}" ]; then
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9093 \
            --alter \
            --topic "$${topic}" \
            --partitions "$${desired}"
        fi
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9093 \
          --describe \
          --topic "$${topic}"

  producer:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.producer
    image: crypto-producer:latest
    container_name: producer
    env_file:
      - ../.env.docker
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: postgres
    ports:
      - "5433:5432"
    env_file:
      - ../.env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../storage/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../dashboard/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 200m

  kafdrop:
    image: obsidiandynamics/kafdrop:3.30.0
    container_name: kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9093
      SERVER_PORT: "9000"
      JVM_OPTS: "-Xms64m -Xmx128m"
    deploy:
      resources:
        limits:
          memory: 200m
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@crypto.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    deploy:
      resources:
        limits:
          memory: 200m
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: crypto-airflow:2.9.0
    container_name: airflow
    ports:
      - "8080:8080"
    env_file:
      - ../.env.docker
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      AIRFLOW__WEBSERVER__WORKERS: 1
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: 600
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: 600
      AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: 0
      GUNICORN_CMD_ARGS: "--timeout 600 --graceful-timeout 600 --worker-tmp-dir /dev/shm"
      PYTHONWARNINGS: "ignore"
      AIRFLOW__CORE__PARALLELISM: 1
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9093"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      PYTHONPATH: "/opt/airflow"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../ai:/opt/airflow/ai:ro
      - ../dbt_project:/opt/airflow/dbt_project
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
    command:
      - bash
      - -c
      - export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}" && rm -f /opt/airflow/airflow-webserver.pid && exec airflow standalone

  spark:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.spark
    image: crypto-spark:3.5.0
    container_name: spark
    env_file:
      - ../.env.docker
    volumes:
      - spark_checkpoints:/tmp/checkpoint
      - spark_raw:/tmp/crypto_raw
      - spark_ivy:/root/.ivy2
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m

# Named volumes persist data across container restarts.
# WARNING: docker compose down -v will DELETE all TimescaleDB and Spark checkpoint data.
# Never use the -v flag unless you intentionally want a full data reset.
volumes:
  postgres_data:
  grafana_data:
  spark_checkpoints:
  spark_raw:
  spark_ivy:

networks:
  default:
    name: crypto_pipeline_net
