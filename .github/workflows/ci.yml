name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check ingestion/ processing/ storage/

      - name: Type check (mypy)
        run: mypy ingestion/ processing/ storage/ --ignore-missing-imports
